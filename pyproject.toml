[project]
name = "edgar-mcp"
version = "0.1.0"
description = "An MCP server for SEC EDGAR, built so a model can read one section of a 10-K instead of all of it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.scripts]
edgar-mcp = "edgar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgar_mcp"]
